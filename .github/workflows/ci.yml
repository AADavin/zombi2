name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Callable, so `release.yml` can require the whole matrix before it publishes anything rather
  # than repeating a thinner copy of it. One definition of "the tests pass".
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on a branch — but never on main. A release push cancelled the run that was
  # still testing the commit before it, and GitHub renders a cancelled run as *failing*: the README
  # badge told every visitor the build was broken when all six OS/Python jobs had passed. A cancelled
  # run is also not an answer to "did this commit pass?", which is the question the badge exists to
  # answer, and the question `release.yml` now gates on.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test (${{ matrix.os-name }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every supported Python on Linux, plus one job each on macOS and Windows. ZOMBI2 is pure
        # Python over numpy, so the versions are where the risk is — but "pure Python" is not the
        # same as portable: paths, newlines and the default text encoding all differ on Windows, and
        # a run writes a great many files. One job there is what lets the install instructions say
        # Windows works without anyone having to take it on trust.
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os-name: [linux]
        include:
          - os: windows-latest
            python-version: "3.12"
            os-name: windows
          - os: macos-latest
            python-version: "3.12"
            os-name: macos
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # The clean core is pure Python (numpy only) — a plain editable install, no build step.
      - name: Install ZOMBI2 (with dev extras)
        run: pip install -e ".[dev]"

      - name: Run the test suite
        run: pytest -q

  # Coverage rides on one job rather than the matrix: it measures which lines the suite reaches, and
  # that is a property of the suite, not of the interpreter running it. Reported, not enforced —
  # a threshold turns a number worth reading into a number worth gaming.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install ZOMBI2 (dev extra)
        run: pip install -e ".[dev]"

      - name: Measure coverage
        run: |
          pytest -q --cov=zombi2 --cov-report=term:skip-covered --cov-report=json
          python - <<'PY'
          import json
          pct = json.load(open("coverage.json"))["totals"]["percent_covered"]
          print(f"::notice title=Coverage::{pct:.1f}% of zombi2 is covered by the test suite")
          PY

  # zombi2 ships `py.typed`, so its annotations are read by the type checker of anyone who installs
  # it. Publishing type information nobody verifies is worse than publishing none, so it is checked
  # here like the tests are. Configuration lives in [tool.mypy] in pyproject.toml.
  types:
    name: types (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install ZOMBI2 (dev extra)
        run: pip install -e ".[dev]"

      - name: Type-check
        run: mypy

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Install the linter from the [dev] extra so it stays the single source of truth for its
      # pinned version — a contributor running `pip install -e ".[dev]"` lints with exactly what CI
      # does. The clean core is pure Python, so no toolchain beyond pip is needed.
      - name: Install ZOMBI2 (dev extra)
        run: pip install -e ".[dev]"

      # The active repo, not just zombi2/: the package, the tests, the figure scripts and the
      # analyses. (There is no longer a legacy/ tree to exclude.) Other
      # exemptions live in [tool.ruff.lint.per-file-ignores] with their rationale.
      - name: Lint
        run: ruff check .

  # CONTRIBUTING asks for a `[Unreleased]` line whenever a user could observe a change, and nothing
  # enforced it: #319 added `zombi2 tools tree --gamma` and `zombi2.tree.gamma_statistic` and went
  # green with the changelog untouched — lint, types, tests and the docs build all pass for a pull
  # request that adds a flag and says nothing about it.
  #
  # The check compares the *public surface* at the merge base and at HEAD (every `--flag` under
  # `zombi2/cli/`, every name in an `__all__` under `zombi2/`), not the diff. A rewritten help
  # string or docstring leaves the surface identical and raises nothing, which is what keeps the
  # check worth reading: the same pull request that added `--gamma` also reworded help text across
  # six CLI modules. Escape hatch: the `no changelog` label.
  #
  # Pull requests only. On a push to main the comparison has no base to make, and the pull request
  # that introduced the commit was already checked.
  changelog:
    name: changelog
    if: >-
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'no changelog')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0        # the guard needs the merge base, so a shallow clone will not do

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # No install: the guard reads the tree with `ast` and shells out to git. It must keep working
      # on a branch whose code does not import.
      - name: Check the public surface against CHANGELOG.md
        run: python scripts/check_public_surface.py --base "origin/${{ github.base_ref }}"

  docs:
    name: docs (mkdocs --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Install the docs toolchain from the [docs] extra so it stays the single
      # source of truth. The clean core is pure Python; the docs build only needs zombi2 importable.
      - name: Install ZOMBI2 (docs extra)
        run: pip install -e ".[docs]"

      - name: Build the documentation (strict)
        run: mkdocs build --strict

  # The gallery is where a zombi2 API rename hides: its example scripts call the library, but nothing
  # ran them, so `extant()` -> `extant_leaves()` broke every gallery figure and CI stayed green. That
  # canary is now tests/test_gallery_api.py — it runs each example with Phylustrator mocked so only the
  # zombi2 calls execute, catching a rename deterministically. It needs no Phylustrator, no rendering
  # and no extra dependency, so it rides in the `test` job above rather than a job of its own. Rendering
  # the gallery for real is deliberately not in CI: the examples target Phylustrator's development API,
  # so no pip-installable Phylustrator draws them, and a render job would go red for a sibling package's
  # release, not for a zombi2 change.

  # The RED benchmark (examples/red_benchmark) exercised zombi2.tools.red and the old CLI, now
  # quarantined in legacy/. Its CI job returns when the tools layer is rebuilt on the clean core.
