<svg viewBox="40 6 334 330" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Iowan Old Style, Palatino, Georgia, serif">
<title>The four levels of ZOMBI2</title>
<desc>Species sits at the top, centred. One line descends from it and forks into two curved arrows, left to Genomes and right to Traits. Genomes continues straight down to Sequences.</desc>
<!-- Colours are presentation ATTRIBUTES, not CSS. GitHub's SVG sanitiser drops the style element, and
     a figure whose fills live there renders in the README as black blobs with no labels or lines.
     CSS outranks a presentation attribute, so the dark-mode rules below still win wherever CSS
     survives. Keep it this way. -->
<style>
  @media (prefers-color-scheme: dark) {
    .node{fill:#191d20;stroke:#e7ebe9}
    .lbl{fill:#e7ebe9}
    .edge{stroke:#e7ebe9}
    .head{fill:#e7ebe9}
  }
</style>
<defs>
  <!-- A plain triangle, deliberately small. A notched "sharp" head reads as a TICK at this size, and
       markerWidth is in stroke-width units, so 5 against stroke 1.7 is ~8.5 user units — in
       proportion to the line rather than five times its weight. -->
  <marker id="a" markerWidth="5" markerHeight="5" refX="4.2" refY="2.5" orient="auto">
    <path class="head" d="M0,0 L5,2.5 L0,5 z" fill="#1a1a1a"/>
  </marker>
</defs>
<!-- One line down from Species, forking left and right. Each branch curves, then finishes with a
     SHORT STRAIGHT VERTICAL before its arrowhead: a marker orients to the final segment, so ending on
     a straight run is what guarantees the head points exactly along the line it terminates. Ending on
     the curve itself leaves the stroke still bending at the tip, and the head visibly skews off it. -->
<g class="edge" fill="none" stroke="#1a1a1a" stroke-width="1.7">
  <line x1="210" y1="72" x2="210" y2="104"/>
  <path d="M 210,104 C 210,124 120,124 120,134 L 120,146" marker-end="url(#a)"/>
  <path d="M 210,104 C 210,124 300,124 300,134 L 300,146" marker-end="url(#a)"/>
  <!-- the chain continues: Genomes -> Sequences -->
  <line x1="120" y1="192" x2="120" y2="266" marker-end="url(#a)"/>
</g>
<g class="node" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6">
  <rect x="154" y="30"  width="112" height="42" rx="21"/>
  <rect x="64"  y="150" width="112" height="42" rx="21"/>
  <rect x="64"  y="270" width="112" height="42" rx="21"/>
  <rect x="250" y="150" width="100" height="42" rx="21"/>
</g>
<!-- Each y is the box's centre plus 5.66, and there is deliberately NO dominant-baseline. librsvg —
     which converts this file for the manual — ignores dominant-baseline, so "central" left the label
     sitting on the box centre as a BASELINE: high in the PDF, while the browser centred it correctly
     in the README. The same two renderers agree on a plain baseline, so the offset is baked into y
     instead. 5.66 = 0.353 em at font-size 16, the font's own central baseline (half the em box above
     the alphabetic one) — Iowan Old Style and Chrome both give 0.3534. Rescale it with the font size. -->
<g class="lbl" fill="#1a1a1a" font-size="16" font-weight="600" text-anchor="middle">
  <text x="210" y="56.66">Species</text>
  <text x="120" y="176.66">Genomes</text>
  <text x="120" y="296.66">Sequences</text>
  <text x="300" y="176.66">Traits</text>
</g>
</svg>
