<svg viewBox="40 6 334 330" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Iowan Old Style, Palatino, Georgia, serif">
<title>The four levels of ZOMBI2</title>
<desc>Species sits at the top, centred. One line descends from it and forks into two curved arrows, left to Genomes and right to Traits. Genomes continues straight down to Sequences.</desc>
<style>
  :root { --ink:#1a1a1a; --paper:#ffffff; }
  @media (prefers-color-scheme: dark) { :root { --ink:#e7ebe9; --paper:#191d20; } }
  .node{fill:var(--paper);stroke:var(--ink);stroke-width:1.6}
  .lbl{fill:var(--ink);font-size:16px;font-weight:600}
  .edge{stroke:var(--ink);stroke-width:1.7;fill:none}
</style>
<defs>
  <!-- a slim, notched head: the concave back reads as an arrow rather than as a blob, and 7 units
       against stroke-width 1.7 keeps it in proportion to a 42px node -->
  <marker id="a" markerWidth="7" markerHeight="7" refX="5.8" refY="3.5" orient="auto"><path d="M0,0.4 L6.6,3.5 L0,6.6 L1.7,3.5 z" fill="var(--ink)"/></marker>
</defs>
<!-- one line down from Species, forking into two curved arrows. Both control points sit at the
     vertical midpoint of the drop, each above its own endpoint: that makes the tangent vertical at
     the fork and again at the arrowhead, so the curve leaves and lands square with no kink. -->
<line class="edge" x1="210" y1="72" x2="210" y2="104"/>
<path class="edge" d="M 210,104 C 210,126 120,126 120,147" marker-end="url(#a)"/>
<path class="edge" d="M 210,104 C 210,126 300,126 300,147" marker-end="url(#a)"/>
<!-- the chain continues: Genomes -> Sequences -->
<line class="edge" x1="120" y1="192" x2="120" y2="267" marker-end="url(#a)"/>
<!-- nodes -->
<rect class="node" x="154" y="30"  width="112" height="42" rx="21"/><text x="210" y="51"  text-anchor="middle" dominant-baseline="central" class="lbl">Species</text>
<rect class="node" x="64"  y="150" width="112" height="42" rx="21"/><text x="120" y="171" text-anchor="middle" dominant-baseline="central" class="lbl">Genomes</text>
<rect class="node" x="64"  y="270" width="112" height="42" rx="21"/><text x="120" y="291" text-anchor="middle" dominant-baseline="central" class="lbl">Sequences</text>
<rect class="node" x="250" y="150" width="100" height="42" rx="21"/><text x="300" y="171" text-anchor="middle" dominant-baseline="central" class="lbl">Traits</text>
</svg>
