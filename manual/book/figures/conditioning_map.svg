<svg viewBox="0 0 566 392" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Iowan Old Style, Palatino, Georgia, serif">
<title>What can condition what</title>
<desc>A four by four grid. Rows are the driver, columns the target: gene families, an ordered or nucleotide genome, sequences and traits. Twelve cells are numbered, keyed to the notes. Four are shaded, the pairs that would need two genomes for one lineage. Three of the four cells on the diagonal carry an inset box: a level conditioning itself.</desc>
<!-- Colours are presentation ATTRIBUTES and literals, not CSS custom properties: GitHub's SVG
     sanitiser drops the style element and librsvg resolves no custom properties, so a figure whose
     fills live in either renders black-on-black. The dark-mode rules below still win wherever CSS
     survives, because CSS outranks a presentation attribute. Same rule as the other chapter
     figures. Keep it this way. -->
<style>
  @media (prefers-color-scheme: dark) {
    .cell{fill:#191d20;stroke:#4a5154}
    .shut{fill:#23282b;stroke:#4a5154}
    .self{stroke:#9aa3a0}
    .lbl{fill:#e7ebe9}
    .dim{fill:#9aa3a0}
    .num{fill:#e7ebe9}
  }
</style>

<!-- axis names -->
<g class="dim" fill="#777777" font-size="11" font-weight="600" letter-spacing="2.4">
  <text x="350" y="20" text-anchor="middle">TARGET</text>
  <text x="18" y="212" text-anchor="middle" transform="rotate(-90 18 212)">DRIVER</text>
</g>

<!-- column labels -->
<g class="lbl" fill="#1a1a1a" font-size="13" text-anchor="middle">
  <text x="196" y="42">Genomes</text>
  <text x="288" y="42">Genomes</text>
  <text x="380" y="42">Sequences</text>
  <text x="472" y="42">Traits</text>
</g>
<g class="dim" fill="#777777" font-size="10.5" text-anchor="middle">
  <text x="196" y="56">(gene families)</text>
  <text x="288" y="56">(ordered / nt)</text>
</g>

<!-- row labels -->
<g class="lbl" fill="#1a1a1a" font-size="13" text-anchor="end">
  <text x="142" y="98">Genomes</text>
  <text x="142" y="160">Genomes</text>
  <text x="142" y="234">Sequences</text>
  <text x="142" y="296">Traits</text>
</g>
<g class="dim" fill="#777777" font-size="10.5" text-anchor="end">
  <text x="142" y="112">(gene families)</text>
  <text x="142" y="174">(ordered / nt)</text>
</g>

<!-- the grid: shaded cells first, then every border, so no stroke is doubled -->
<g class="shut" fill="#ebebeb" stroke="none">
  <rect x="242" y="66"  width="92" height="62"/>
  <rect x="150" y="128" width="92" height="62"/>
  <rect x="242" y="128" width="92" height="62"/>
  <rect x="242" y="190" width="92" height="62"/>
</g>
<g class="cell" fill="none" stroke="#a8a8a8" stroke-width="1.1">
  <rect x="150" y="66"  width="92" height="62"/><rect x="242" y="66"  width="92" height="62"/>
  <rect x="334" y="66"  width="92" height="62"/><rect x="426" y="66"  width="92" height="62"/>
  <rect x="150" y="128" width="92" height="62"/><rect x="242" y="128" width="92" height="62"/>
  <rect x="334" y="128" width="92" height="62"/><rect x="426" y="128" width="92" height="62"/>
  <rect x="150" y="190" width="92" height="62"/><rect x="242" y="190" width="92" height="62"/>
  <rect x="334" y="190" width="92" height="62"/><rect x="426" y="190" width="92" height="62"/>
  <rect x="150" y="252" width="92" height="62"/><rect x="242" y="252" width="92" height="62"/>
  <rect x="334" y="252" width="92" height="62"/><rect x="426" y="252" width="92" height="62"/>
</g>

<!-- a level conditioning itself: an inset box, so the grid lines stay even -->
<g class="self" fill="none" stroke="#4a4a4a" stroke-width="1.5">
  <rect x="155" y="71"  width="82" height="52"/>
  <rect x="339" y="195" width="82" height="52"/>
  <rect x="431" y="257" width="82" height="52"/>
</g>

<!-- the twelve pairs -->
<g class="num" fill="#1a1a1a" font-size="17" font-weight="600" text-anchor="middle">
  <text x="196" y="103">1</text>  <text x="380" y="103">2</text>  <text x="472" y="103">3</text>
  <text x="380" y="165">4</text>  <text x="472" y="165">5</text>
  <text x="196" y="227">6</text>  <text x="380" y="227">7</text>  <text x="472" y="227">8</text>
  <text x="196" y="289">9*</text> <text x="288" y="289">10*</text>
  <text x="380" y="289">11*</text><text x="472" y="289">12*</text>
</g>

<!-- key -->
<rect class="shut" x="150" y="332" width="20" height="14" fill="#ebebeb" stroke="#a8a8a8" stroke-width="1.1"/>
<rect class="cell" x="150" y="356" width="20" height="14" fill="none" stroke="#a8a8a8" stroke-width="1.1"/>
<rect class="self" x="153" y="359" width="14" height="8" fill="none" stroke="#4a4a4a" stroke-width="1.5"/>
<g class="dim" fill="#666666" font-size="11">
  <text x="178" y="343">not a model: a lineage has one ordered genome, so this would need two</text>
  <text x="178" y="367">a level conditioning itself: two runs of the same level</text>
  <text x="150" y="388">*  can also be written on the command line; the rest need the Python library</text>
</g>
</svg>
