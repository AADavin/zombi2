<svg viewBox="-6 6 418 362" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Iowan Old Style, Palatino, Georgia, serif">
<title>Joining: which levels are simulated together</title>
<desc>The four levels of ZOMBI2 in the same arrangement as the levels figure. Solid double-headed arrows mark the seven joint models that exist: Species with Genomes, Species with Traits, Genomes with Traits, Traits with Sequences, and each of Genomes, Traits and Sequences with itself. One dashed arrow marks the pair nothing rules out and nobody has written. One pair has no arrow at all: the species tree with a sequence.</desc>
<!-- Built on the four-levels figure (manual/book/figures/fig-2-1-four-levels.svg): same node
     positions, same box style, same label baseline offset. What changes is the edges. There the
     arrows run one way, because a level is grown and the next reads it. Here every arrow is
     double-headed, because neither level can be finished before the other starts: a joint pair
     still has a driver and a target, but no order to grow them in.
     Colours stay presentation attributes so GitHub's sanitiser cannot strip them. -->
<style>
  @media (prefers-color-scheme: dark) {
    .node{fill:#191d20;stroke:#e7ebe9}
    .lbl{fill:#e7ebe9}
    .edge{stroke:#e7ebe9}
    .open{stroke:#8b9296}
    .head{fill:#e7ebe9}
    .openhead{fill:#8b9296}
    .note{fill:#9aa1a5}
  }
</style>
<!-- Arrowheads are in USER units, not stroke widths. On the default (markerUnits="strokeWidth") the
     head is scaled by the line it sits on, so the solid heads came out a third larger than the
     dashed ones and both were long enough to cut the corner of a curve and to overshoot into a box.
     Fixed at 9 by 7 they are the same on every edge, and `refX` puts the TIP on the path's endpoint —
     so every path below ends exactly on the outline it points at. A box with rx=21 is a rounded
     rectangle, so its outline on the short sides is the cap circle, not the bounding box: the
     Genomes cap is centred (85,171) with r=21, which is where the loop's two attachment points
     come from. -->
<defs>
  <marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="7" refX="9" refY="3.5"
          orient="auto">
    <path class="head" d="M0,0 L9,3.5 L0,7 z" fill="#1a1a1a"/>
  </marker>
  <marker id="a0" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="7" refX="0" refY="3.5"
          orient="auto">
    <path class="head" d="M9,0 L0,3.5 L9,7 z" fill="#1a1a1a"/>
  </marker>
  <marker id="o" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="7" refX="9" refY="3.5"
          orient="auto">
    <path class="openhead" d="M0,0 L9,3.5 L0,7 z" fill="#9a9a9a"/>
  </marker>
  <marker id="o0" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="7" refX="0" refY="3.5"
          orient="auto">
    <path class="openhead" d="M9,0 L0,3.5 L9,7 z" fill="#9a9a9a"/>
  </marker>
</defs>

<!-- BUILT. The two that reach Species simulate the tree, so it comes out of the run. The other
     five are on a tree handed to the run: Genomes with Traits, Traits with Sequences, Genomes with
     itself — one family driving the rates of the genome it sits in — Traits with itself, two
     characters each reading the other, and Sequences with itself, two genes each reading the
     other's composition. -->
<g class="edge" fill="none" stroke="#1a1a1a" stroke-width="2.1">
  <path d="M 186,72 C 162,102 120,112 120,150" marker-end="url(#a)" marker-start="url(#a0)"/>
  <path d="M 234,72 C 258,102 300,112 300,150" marker-end="url(#a)" marker-start="url(#a0)"/>
  <path d="M 176,171 L 250,171" marker-end="url(#a)" marker-start="url(#a0)"/>
  <!-- the two loops leave and re-enter the cap circle along its own radius, so each head points at
       the middle of the box rather than across its corner -->
  <path d="M 65.97,179.87 C 9.8,206.1 9.8,135.9 65.97,162.13" marker-end="url(#a)" marker-start="url(#a0)"/>
  <path d="M 348.03,179.87 C 404.2,206.1 404.2,135.9 348.03,162.13" marker-end="url(#a)" marker-start="url(#a0)"/>
  <!-- the sequence level joined to itself: two genes, each one's substitution rate reading
       the other's composition, walked together in slices -->
  <path d="M 65.97,299.87 C 9.8,326.1 9.8,255.9 65.97,282.13" marker-end="url(#a)" marker-start="url(#a0)"/>
  <!-- a trait and a gene's sequence, each driving the other, on a tree the run is handed -->
  <path d="M 300,192 C 300,244 238,291 176,291" marker-end="url(#a)" marker-start="url(#a0)"/>
</g>

<!-- NOT BUILT: nothing rules this out. Genomes and Sequences can be joined and never conditioned —
     a sequence is grown along the gene trees the genome level produces, so reading it back would
     condition a run on its own output — and no engine for the pair exists.
     One pair is deliberately absent rather than dashed: a sequence and the species tree, because a
     sequence lives on a gene tree, so simulating it with the tree would mean simulating the genome
     as well. -->
<g class="open" fill="none" stroke="#9a9a9a" stroke-width="1.6" stroke-dasharray="5 4">
  <path d="M 120,192 L 120,270" marker-end="url(#o)" marker-start="url(#o0)"/>
</g>

<g class="node" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6">
  <rect x="154" y="30"  width="112" height="42" rx="21"/>
  <rect x="64"  y="150" width="112" height="42" rx="21"/>
  <rect x="64"  y="270" width="112" height="42" rx="21"/>
  <rect x="250" y="150" width="100" height="42" rx="21"/>
</g>

<g class="lbl" fill="#1a1a1a" font-size="16" font-weight="600" text-anchor="middle">
  <text x="210" y="56.66">Species</text>
  <text x="120" y="176.66">Genomes</text>
  <text x="120" y="296.66">Sequences</text>
  <text x="300" y="176.66">Traits</text>
</g>

<g class="note"
 fill="#6a6a6a" font-size="10" text-anchor="start">
  <text x="-2" y="344">Solid: built. Dashed: not built, nothing rules it out. A loop is a level joined to itself.</text>
  <text x="-2" y="359">No arrow at all: the tree with a sequence, which lives two levels down, on a gene tree.</text>
</g>
</svg>
