<svg viewBox="-6 6 418 362" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Iowan Old Style, Palatino, Georgia, serif">
<title>Joining: which levels are simulated together</title>
<desc>The four levels of ZOMBI2 in the same arrangement as the levels figure. Solid double-headed arrows mark the five joint models that exist: Species with Genomes, Species with Traits, Genomes with Traits, Genomes with itself, and Traits with itself. Dashed arrows and loops mark the three pairs nothing rules out and nobody has written. One pair has no arrow at all: the species tree with a sequence.</desc>
<!-- Built on the four-levels figure (manual/book/figures/fig-2-1-four-levels.svg): same node
     positions, same box style, same label baseline offset. What changes is the edges. There the
     arrows run one way, because a level is grown and the next reads it. Here every arrow is
     double-headed, because neither level can be finished before the other starts: a joint pair
     still has a driver and a target, but no order to grow them in.
     Colours stay presentation attributes so GitHub's sanitiser cannot strip them. -->
<style>
  @media (prefers-color-scheme: dark) {
    .node{fill:#191d20;stroke:#e7ebe9}
    .lbl{fill:#e7ebe9}
    .edge{stroke:#e7ebe9}
    .open{stroke:#8b9296}
    .head{fill:#e7ebe9}
    .openhead{fill:#8b9296}
    .note{fill:#9aa1a5}
  }
</style>
<defs>
  <marker id="a" markerWidth="5" markerHeight="5" refX="4.2" refY="2.5" orient="auto">
    <path class="head" d="M0,0 L5,2.5 L0,5 z" fill="#1a1a1a"/>
  </marker>
  <marker id="a0" markerWidth="5" markerHeight="5" refX="0.8" refY="2.5" orient="auto">
    <path class="head" d="M5,0 L0,2.5 L5,5 z" fill="#1a1a1a"/>
  </marker>
  <marker id="o" markerWidth="5" markerHeight="5" refX="4.2" refY="2.5" orient="auto">
    <path class="openhead" d="M0,0 L5,2.5 L0,5 z" fill="#9a9a9a"/>
  </marker>
  <marker id="o0" markerWidth="5" markerHeight="5" refX="0.8" refY="2.5" orient="auto">
    <path class="openhead" d="M5,0 L0,2.5 L5,5 z" fill="#9a9a9a"/>
  </marker>
</defs>

<!-- BUILT. The two that reach Species simulate the tree, so it comes out of the run. The other
     three are on a tree handed to the run: Genomes with Traits, Genomes with itself — one family
     driving the rates of the genome it sits in — and Traits with itself, two characters each
     reading the other. -->
<g class="edge" fill="none" stroke="#1a1a1a" stroke-width="2.1">
  <path d="M 186,74 C 162,102 120,112 120,144" marker-end="url(#a)" marker-start="url(#a0)"/>
  <path d="M 234,74 C 258,102 300,112 300,144" marker-end="url(#a)" marker-start="url(#a0)"/>
  <path d="M 182,171 L 244,171" marker-end="url(#a)" marker-start="url(#a0)"/>
  <path d="M 62,160 C 24,146 24,196 62,182" marker-end="url(#a)" marker-start="url(#a0)"/>
  <path d="M 352,160 C 390,146 390,196 352,182" marker-end="url(#a)" marker-start="url(#a0)"/>
</g>

<!-- NOT BUILT: nothing rules these out. One pair is deliberately absent rather than dashed — a
     sequence and the species tree, because a sequence lives on a gene tree, so simulating it with
     the tree would mean simulating the genome as well.
     Traits and Sequences was absent here until the two directions were both built: a trait drives a
     gene's substitution rate, and that gene's composition drives the trait. Either alone is
     conditioning. Both at once is a cycle, so the pair is joinable and now carries a dashed arrow. -->
<g class="open" fill="none" stroke="#9a9a9a" stroke-width="1.6" stroke-dasharray="5 4">
  <path d="M 120,198 L 120,264" marker-end="url(#o)" marker-start="url(#o0)"/>
  <path d="M 300,198 C 300,244 244,291 182,291" marker-end="url(#o)" marker-start="url(#o0)"/>
  <!-- a level joined to itself: many genes, many characters, inside one run. The genome's own
       loop is solid above — a named family driving the rates of the genome it sits in. -->
  <path d="M 62,280 C 24,266 24,316 62,302" marker-end="url(#o)" marker-start="url(#o0)"/>
</g>

<g class="node" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6">
  <rect x="154" y="30"  width="112" height="42" rx="21"/>
  <rect x="64"  y="150" width="112" height="42" rx="21"/>
  <rect x="64"  y="270" width="112" height="42" rx="21"/>
  <rect x="250" y="150" width="100" height="42" rx="21"/>
</g>

<g class="lbl" fill="#1a1a1a" font-size="16" font-weight="600" text-anchor="middle">
  <text x="210" y="56.66">Species</text>
  <text x="120" y="176.66">Genomes</text>
  <text x="120" y="296.66">Sequences</text>
  <text x="300" y="176.66">Traits</text>
</g>

<g class="note"
 fill="#6a6a6a" font-size="10" text-anchor="start">
  <text x="-2" y="344">Solid: built. Dashed: not built, nothing rules it out. A loop is a level joined to itself.</text>
  <text x="-2" y="359">No arrow at all: the tree with a sequence, which lives two levels down, on a gene tree.</text>
</g>
</svg>
