<svg viewBox="0 0 640 510" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Iowan Old Style, Palatino, Georgia, serif">
<title>Drivers, mappings and targets, level by level</title>
<desc>Four columns, one per level: gene families, an ordered or nucleotide genome, sequences and traits. The DRIVERS band gives the value each level offers to be read; the two genome columns share one cell there, because both resolutions offer the same one. The TARGETS band is split into three kinds: rates (how often), extents (how much) and choices (which lineage receives a transfer).</desc>
<!-- Colours are presentation ATTRIBUTES and literals, not CSS custom properties: GitHub's SVG
     sanitiser drops the style element and librsvg resolves no custom properties, so a figure whose
     fills live in either renders black-on-black. The dark-mode rules below still win wherever CSS
     survives. Same rule as the other chapter figures. -->
<style>
  @media (prefers-color-scheme: dark) {
    .lbl{fill:#e7ebe9}
    .dim{fill:#9aa3a0}
    .rule{stroke:#4a5154}
    .band{fill:#23282b}
    .subband{fill:#1d2124}
  }
</style>

<!-- column heads -->
<g class="lbl" fill="#1a1a1a" font-size="13" font-weight="600" text-anchor="middle">
  <text x="90"  y="20">Genomes</text>
  <text x="248" y="20">Genomes</text>
  <text x="406" y="20">Sequences</text>
  <text x="558" y="20">Traits</text>
</g>
<g class="dim" fill="#777777" font-size="10.5" text-anchor="middle">
  <text x="90"  y="34">(gene families)</text>
  <text x="248" y="34">(ordered / nucleotide)</text>
</g>

<!-- Column rules. The rule between the two genome
     columns breaks twice: across DRIVERS, where both resolutions offer the same driver, and again
     across the choice, where both offer the same transfer_to. -->
<g class="rule" stroke="#d5d5d5" stroke-width="0.9">
  <line x1="169" y1="8"   x2="169" y2="46"/>
  <line x1="169" y1="158" x2="169" y2="452"/>
  <line x1="327" y1="8"   x2="327" y2="504"/>
  <line x1="485" y1="8"   x2="485" y2="504"/>
</g>

<!-- band A: what a level offers as a driver -->
<rect class="band" x="0" y="46" width="640" height="18" fill="#f2f2f2"/>
<text class="dim" x="6" y="59" fill="#666666" font-size="9.5" font-weight="600" letter-spacing="2.2">DRIVERS</text>

<g class="lbl" fill="#1a1a1a" font-size="11.5" text-anchor="middle">
  <text x="169" y="84">a family's presence</text>
  <text x="406" y="84">GC and composition</text>
  <text x="558" y="84">a discrete state</text>
</g>
<g class="dim" fill="#777777" font-size="10" text-anchor="middle">
  <text x="169" y="98">present or absent</text>
  <text x="406" y="98">a number</text>
  <text x="558" y="98">one of the states</text>
</g>
<g class="lbl" fill="#1a1a1a" font-size="11.5" text-anchor="middle">
  <text x="169" y="122">a module's completion</text>
  <text x="558" y="122">a continuous value</text>
</g>
<g class="dim" fill="#777777" font-size="10" text-anchor="middle">
  <text x="169" y="136">a fraction, 0 to 1</text>
  <text x="558" y="136">a number</text>
</g>
<text class="dim" x="169" y="150" fill="#999999" font-size="9" font-style="italic" text-anchor="middle">the same at both resolutions</text>

<!-- band C: what a level offers as a target, in its three kinds. Rates are only the first of them:
     an extent is "how much" and transfer_to is a "choice", and both take a driver too. Naming all
     three is what stops transfer from looking like an exception to the scheme. -->
<rect class="band" x="0" y="158" width="640" height="18" fill="#f2f2f2"/>
<text class="dim" x="6" y="171" fill="#666666" font-size="9.5" font-weight="600" letter-spacing="2.2">TARGETS</text>

<rect class="subband" x="0" y="182" width="640" height="14" fill="#fafafa"/>
<text class="dim" x="6" y="192" fill="#888888" font-size="9" font-style="italic">how often — the rates</text>

<g class="lbl" fill="#1a1a1a" font-size="11.5" text-anchor="middle">
  <text x="90"  y="212">duplication</text>
  <text x="90"  y="227">transfer</text>
  <text x="90"  y="242">loss</text>
  <text x="90"  y="257">origination</text>

  <text x="248" y="212">duplication</text>
  <text x="248" y="227">transfer</text>
  <text x="248" y="242">loss</text>
  <text x="248" y="257">origination</text>
  <text x="248" y="277">inversion</text>
  <text x="248" y="292">transposition</text>
  <text x="248" y="307">translocation</text>
  <text x="248" y="327">fission</text>
  <text x="248" y="342">fusion</text>
  <text x="248" y="357">chromosome origination</text>
  <text x="248" y="372">chromosome loss</text>

  <text x="406" y="212">substitution</text>

  <text x="558" y="212">rate</text>
  <text x="558" y="245">switch</text>
</g>
<g class="dim" fill="#777777" font-size="10" text-anchor="middle">
  <text x="406" y="225">per site, per unit time</text>
  <text x="558" y="225">the variance-rate, continuous</text>
  <text x="558" y="258">per transition, discrete</text>
</g>

<rect class="subband" x="0" y="392" width="640" height="14" fill="#fafafa"/>
<text class="dim" x="6" y="402" fill="#888888" font-size="9" font-style="italic">how much — the extents</text>

<text class="lbl" x="248" y="422" fill="#1a1a1a" font-size="11.5" text-anchor="middle">every event's extent</text>
<g class="dim" fill="#777777" font-size="10" text-anchor="middle">
  <text x="248" y="435">in genes, or in base pairs</text>
  <text x="90"  y="422">an event moves one gene,</text>
  <text x="90"  y="435">so there is nothing to size</text>
</g>

<rect class="subband" x="0" y="452" width="640" height="14" fill="#fafafa"/>
<text class="dim" x="6" y="462" fill="#888888" font-size="9" font-style="italic">a choice — which lineage receives a transfer</text>

<text class="lbl" x="169" y="482" fill="#1a1a1a" font-size="11.5" text-anchor="middle">transfer_to</text>
<text class="dim" x="169" y="495" fill="#777777" font-size="10" text-anchor="middle">a weight per candidate, not a multiplier</text>

</svg>
