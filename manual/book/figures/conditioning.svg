<svg viewBox="0 0 660 240" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Iowan Old Style, Palatino, Georgia, serif">
<title>Conditioning: a driver, the rate it conditions, and the mapping between them</title>
<desc>On the left, a box labelled habitat, with a small two-state diagram below it showing aquatic and terrestrial switching between each other. An arrow runs right to the gene loss rate, the target, labelled conditions, carrying a multiplier for each habitat state.</desc>
<!-- The arrow's verb is ACTIVE and points the way the causation does: habitat conditions loss. It
     used to read "DrivenBy", which was passive, so an arrow drawn cause-to-effect carried a label
     that names the relation effect-to-cause — read along the arrow it said "habitat is driven by
     loss", the exact opposite of the model.
     This is Chapter 2's figure, and Chapter 2 is a tour: it names the three parts and stops. It
     therefore carries NO Python, and the target box carries no base — a reader meeting the idea for
     the first time does not need a number to see that one thing sets another. Chapter 9 is where
     the expression gets written out, and it has figures of its own for that. The arrow's word is
     "conditions" because it is the same word the chapter's heading uses; the verbs (scaled_by and
     the rest) are a Chapter 9 distinction.
     The canvas was 690 wide when a monospace expression sat under the target box and was the widest
     thing in the figure. With that gone the target box is, ending at x=638, so 660 leaves the same
     margin on the right as the driver box has on the left. -->
<!-- The dark-mode note:
     Colours are presentation ATTRIBUTES, not CSS, and are literals rather than a CSS custom property: GitHub's
     SVG sanitiser drops the style element, and librsvg resolves no custom properties, so a figure
     whose fills live in either renders as black-on-black. The dark-mode rules below still win
     wherever CSS survives, because CSS outranks a presentation attribute. Keep it this way. -->
<style>
  @media (prefers-color-scheme: dark) {
    .node{fill:#191d20;stroke:#e7ebe9}
    .lbl{fill:#e7ebe9}
    .dim{fill:#9aa3a0}
    .edge{stroke:#e7ebe9}
    .head{fill:#e7ebe9}
  }
</style>
<defs>
  <!-- Sized in stroke-width units, so the small state diagram's heads shrink with its thinner
       stroke without a second marker. -->
  <marker id="cb" markerWidth="5" markerHeight="5" refX="4.2" refY="2.5" orient="auto">
    <path class="head" d="M0,0 L5,2.5 L0,5 z" fill="#1a1a1a"/>
  </marker>
</defs>

<!-- column headings: two things and the relation between them -->
<g class="dim" fill="#6e6e6e" font-size="12.5" letter-spacing="1.6" text-anchor="middle">
  <text x="120" y="34">DRIVER</text>
  <text x="555" y="34">TARGET</text>
</g>
<g class="dim" fill="#8a8a8a" font-size="12.5" font-style="italic" text-anchor="middle">
  <text x="120" y="52">a value, grown first</text>
  <text x="555" y="52">what you write it on</text>
</g>

<!-- the driver: one thing, named -->
<g class="node" fill="#f2f2f0" stroke="#1a1a1a" stroke-width="1.6">
  <rect x="45" y="96" width="150" height="60" rx="7"/>
</g>
<g class="lbl" fill="#1a1a1a" font-size="16" text-anchor="middle">
  <text x="120" y="132">habitat</text>
</g>

<!-- its states, small: what the driver is made of -->
<g class="node" fill="#f7f7f5" stroke="#1a1a1a" stroke-width="1.2">
  <ellipse cx="66" cy="202" rx="36" ry="17"/>
  <ellipse cx="174" cy="202" rx="36" ry="17"/>
</g>
<g class="lbl" fill="#1a1a1a" font-size="11" text-anchor="middle">
  <text x="66" y="206">aquatic</text>
  <text x="174" y="206">terrestrial</text>
</g>
<g class="edge" fill="none" stroke="#1a1a1a" stroke-width="1.2">
  <path d="M 103,194 C 112,185 128,185 137,194" marker-end="url(#cb)"/>
  <path d="M 137,210 C 128,219 112,219 103,210" marker-end="url(#cb)"/>
</g>

<!-- the relation, read in the direction it is drawn; the mapping is what it carries -->
<g class="edge" fill="none" stroke="#1a1a1a" stroke-width="1.7">
  <line x1="203" y1="126" x2="462" y2="126" marker-end="url(#cb)"/>
</g>
<g class="lbl" fill="#1a1a1a" font-size="14.5" text-anchor="middle">
  <text x="332" y="116" font-style="italic">conditions</text>
</g>
<g class="dim" fill="#6e6e6e" font-size="13.5" text-anchor="middle">
  <text x="332" y="153">aquatic &#215;&#8202;4</text>
  <text x="332" y="171">terrestrial &#215;&#8202;1</text>
</g>

<!-- the target rate: named, and nothing else. Set like the driver box opposite it, so the two read
     as the same kind of thing. -->
<g class="node" fill="#f2f2f0" stroke="#1a1a1a" stroke-width="1.6">
  <rect x="472" y="96" width="166" height="60" rx="7"/>
</g>
<g class="lbl" fill="#1a1a1a" font-size="16" text-anchor="middle">
  <text x="555" y="132">loss</text>
</g>
</svg>
