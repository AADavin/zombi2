<svg viewBox="0 0 690 250" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Iowan Old Style, Palatino, Georgia, serif">
<title>Conditioning: a driver, the rate it drives, and where the verb is written</title>
<desc>On the left, a box labelled habitat, with a small two-state diagram below it showing aquatic and terrestrial switching between each other. An arrow runs right to the gene loss rate, the target, labelled drives, carrying a multiplier for each habitat state. Under the loss rate is the expression you write on it, a per-copy loss rate of 0.25 scaled by habitat.</desc>
<!-- The arrow's verb is ACTIVE and points the way the causation does: habitat drives loss. It used
     to read "DrivenBy", which was passive, so an arrow drawn cause-to-effect carried a label that
     names the relation effect-to-cause — read along the arrow it said "habitat is driven by loss",
     the exact opposite of the model. The verb now sits under the TARGET, which is both where it
     reads correctly and where it is actually typed: loss = PerCopy(0.25).scaled_by(habitat, ...).
     That expression is copied from Chapter 9's own example, so the picture and the sentence beside
     it say the same thing. It has been restated at every change to how a rate is written — first
     DrivenBy, then ScaledBy, now the verb as a method on the scope that carries the base — and
     each time the figure was found last, so check it whenever the grammar moves.
     The canvas gained 30 units on the right for it, 660 to 690: with the scope written the
     expression is the widest thing in the figure, and it is set in a monospace the two renderers
     disagree about. librsvg, which builds the book's PNG, sets it about 25% narrower than Menlo,
     which is what a mac browser reaches for on the docs site. Sized for the wider of the two, so
     neither clips it.
     Colours are presentation ATTRIBUTES, not CSS, and are literals rather than a CSS custom property: GitHub's
     SVG sanitiser drops the style element, and librsvg resolves no custom properties, so a figure
     whose fills live in either renders as black-on-black. The dark-mode rules below still win
     wherever CSS survives, because CSS outranks a presentation attribute. Keep it this way. -->
<style>
  @media (prefers-color-scheme: dark) {
    .node{fill:#191d20;stroke:#e7ebe9}
    .lbl{fill:#e7ebe9}
    .dim{fill:#9aa3a0}
    .edge{stroke:#e7ebe9}
    .head{fill:#e7ebe9}
  }
</style>
<defs>
  <!-- Sized in stroke-width units, so the small state diagram's heads shrink with its thinner
       stroke without a second marker. -->
  <marker id="cb" markerWidth="5" markerHeight="5" refX="4.2" refY="2.5" orient="auto">
    <path class="head" d="M0,0 L5,2.5 L0,5 z" fill="#1a1a1a"/>
  </marker>
</defs>

<!-- column headings: two things and the relation between them -->
<g class="dim" fill="#6e6e6e" font-size="12.5" letter-spacing="1.6" text-anchor="middle">
  <text x="120" y="34">DRIVER</text>
  <text x="555" y="34">TARGET</text>
</g>
<g class="dim" fill="#8a8a8a" font-size="12.5" font-style="italic" text-anchor="middle">
  <text x="120" y="52">a value, grown first</text>
  <text x="555" y="52">what you write it on</text>
</g>

<!-- the driver: one thing, named -->
<g class="node" fill="#f2f2f0" stroke="#1a1a1a" stroke-width="1.6">
  <rect x="45" y="96" width="150" height="60" rx="7"/>
</g>
<g class="lbl" fill="#1a1a1a" font-size="16" text-anchor="middle">
  <text x="120" y="132">habitat</text>
</g>

<!-- its states, small: what the driver is made of -->
<g class="node" fill="#f7f7f5" stroke="#1a1a1a" stroke-width="1.2">
  <ellipse cx="66" cy="212" rx="36" ry="17"/>
  <ellipse cx="174" cy="212" rx="36" ry="17"/>
</g>
<g class="lbl" fill="#1a1a1a" font-size="11" text-anchor="middle">
  <text x="66" y="216">aquatic</text>
  <text x="174" y="216">terrestrial</text>
</g>
<g class="edge" fill="none" stroke="#1a1a1a" stroke-width="1.2">
  <path d="M 103,204 C 112,195 128,195 137,204" marker-end="url(#cb)"/>
  <path d="M 137,220 C 128,229 112,229 103,220" marker-end="url(#cb)"/>
</g>

<!-- the relation, read in the direction it is drawn; the mapping is what it carries -->
<g class="edge" fill="none" stroke="#1a1a1a" stroke-width="1.7">
  <line x1="203" y1="126" x2="462" y2="126" marker-end="url(#cb)"/>
</g>
<g class="lbl" fill="#1a1a1a" font-size="14.5" text-anchor="middle">
  <text x="332" y="116" font-style="italic">drives</text>
</g>
<g class="dim" fill="#6e6e6e" font-size="13.5" text-anchor="middle">
  <text x="332" y="153">aquatic &#215;&#8202;4</text>
  <text x="332" y="171">terrestrial &#215;&#8202;1</text>
</g>

<!-- the target rate, and the expression that carries the driver -->
<g class="node" fill="#f2f2f0" stroke="#1a1a1a" stroke-width="1.6">
  <rect x="472" y="96" width="166" height="60" rx="7"/>
</g>
<g class="lbl" fill="#1a1a1a" text-anchor="middle">
  <text x="555" y="120" font-size="15">loss</text>
  <text x="555" y="142" font-size="13.5" fill="#6e6e6e">base 0.25</text>
</g>
<g class="dim" fill="#6e6e6e" font-size="10.5" text-anchor="middle"
   font-family="SFMono-Regular, Menlo, Consolas, monospace">
  <text x="555" y="180">PerCopy(0.25).scaled_by(habitat, &#8230;)</text>
</g>
</svg>
