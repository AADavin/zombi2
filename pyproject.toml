[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zombi2"
# Single-sourced from zombi2/__init__.py (__version__) via [tool.hatch.version].
dynamic = ["version"]
description = "Simulating the evolution of species trees, genomes, sequences and traits"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Adrián A. Davin" }]
keywords = ["phylogenetics", "simulation", "gene families", "birth-death", "evolution"]
# The clean core is pure Python. numpy does the arithmetic; tqdm draws the progress bar the
# commands show while they work, and is optional at runtime — zombi2.progress falls back to a
# silent no-op without it, so a run behaves the same either way.
dependencies = [
    # upper bounds so a future major release cannot break an install of a pinned zombi2:
    # neither project promises compatibility across one, and this package is not there to
    # find out during someone's course.
    "numpy>=1.24,<3",
    "tqdm>=4.60,<5",
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/AADavin/zombi2"
Documentation = "https://aadavin.github.io/zombi2/"
Repository = "https://github.com/AADavin/zombi2"
Issues = "https://github.com/AADavin/zombi2/issues"

[project.optional-dependencies]
# ruff is pinned to a minor series: its rule set (and its autofixes) evolve between releases, and
# [tool.ruff.lint] below deliberately pins *which* rules we run — an unpinned linter would let a
# ruff release turn CI red without a change on our side. Bump it deliberately.
dev = ["pytest>=7", "pytest-cov", "scipy>=1.10", "ruff>=0.12,<0.13", "mypy>=1.11"]
docs = ["mkdocs-material", "mkdocstrings[python]"]
# Parsers for external reconciliation-tool output (zombi2.tools.reconparser: ALE, AleRax).
# Trees are parsed with ZOMBI2's own zombi2.tree.read_newick (no ete3), so the only extra
# dependency is pandas for the table outputs; it stays out of the base install.
reconparser = ["pandas>=2.0.0"]
# Snakemake benchmarking workflows (examples/). snakemake pulls pyyaml transitively, but the
# Snakefile imports it directly, so pin it; matplotlib renders the summary figures; the SLURM
# executor plugin is only needed to run on a cluster.
bench = ["snakemake>=8", "snakemake-executor-plugin-slurm", "matplotlib", "pyyaml"]
# The examples gallery (gallery/) — simulates with zombi2 and plots with Phylustrator. Not a runtime
# dependency of the library, and not what guards the examples in CI (that is tests/test_gallery_api.py,
# which runs them with Phylustrator mocked so only the zombi2 calls execute — no rendering, no extra
# dependency). This extra is for regenerating web/gallery.html locally: Phylustrator draws the figures,
# matplotlib the companion panels, pillow embeds them, and cairosvg is the SVG->PNG rasterizer
# Phylustrator needs (it declares it only as an optional "export" extra, so without it .save("x.png")
# silently writes nothing and the composite examples crash reading a PNG that was never produced).
#
# Caveat, deliberately not pinned around: the examples call Phylustrator's *development* API (e.g.
# time_axis(bold=...)), so no released Phylustrator renders the whole gallery yet — a full local
# regenerate needs a checkout of Phylustrator, not a pip install. The pin below is the floor that
# renders the parts that do work; raise it to a release that carries the gallery's API when there is one.
gallery = ["phylustrator==0.1.0", "cairosvg>=2.5", "matplotlib", "pillow"]

# The `zombi2` CLI exposes one command per level — `species`, `genomes`, `sequences`, `traits` —
# plus `joint`, which grows a species tree together with the level driving it, and `tools`, which
# runs analyses over a finished run.
[project.scripts]
zombi2 = "zombi2.cli.main:main"

[tool.hatch.version]
path = "zombi2/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["zombi2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
# zombi2 ships `py.typed`, so its annotations are what a user's own type checker reads — they are
# part of the public surface and CI checks them like any other. Defaults otherwise: bodies of
# unannotated functions are not analysed, which keeps the gate about what the package *promises*.
python_version = "3.10"
files = ["zombi2"]

[[tool.mypy.overrides]]
# tqdm ships no type information and has no stub package we depend on; the progress bar is optional
# at runtime anyway (zombi2._runtime.progress falls back to a no-op without it).
module = "tqdm.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `tomllib` is standard from 3.11 and `tomli` is the 3.10 backport, so exactly one of the pair exists
# on any supported Python — which is what the try/except in zombi2.cli._params selects between. The
# check runs at `python_version = "3.10"`, where the stdlib one is not there to find.
module = ["tomllib", "tomli"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Ruff's default rule set (pyflakes + core pycodestyle), pinned, minus a few that flag
# deliberate, readable patterns in the numerical code.
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E741",  # ambiguous names like `l` / `O` — conventional in the rate-matrix / math code
    "E702",  # multiple statements on one line (;) — tight COO sparse-assembly loops
    "E731",  # lambda assignment — occasional and deliberate
]

[tool.ruff.lint.per-file-ignores]
# The reconparser parsers are vendored from https://github.com/AADavin/reconparser and kept
# close to upstream to make future syncs trivial; exempt their upstream idioms from our lint.
"zombi2/tools/reconparser/parsers/*.py" = [
    "F401",  # typing.Tuple imported but unused
    "F841",  # a bookkeeping local (num_trees) assigned but unused
]
# The figure scripts share one house-style vocabulary import (`from zombi_style import FONT, INK,
# MUTED, FS_TITLE, FS_LABEL, FS_ANNOT, FS_TICK` — 44 scripts, 19 of them the identical line). Every
# script imports the whole vocabulary whether or not it uses every name, so the set stays uniform
# and a figure can start using one without touching its imports. Pruning per-script would make the
# family inconsistent for no gain.
# `fig_overview.py` additionally has to put the repo and `gallery/` on the path before it can
# import them, so its own imports cannot be hoisted above that (E402) — the same reason
# `gallery/helpers.py` is exempt below.
"figures/scripts/*.py" = ["F401", "E402"]
# The test suite organises long files into sections under banner comments, with each section's
# imports at its head rather than hoisted to the top of the file. That keeps a section readable as
# a unit; imports-at-top is the only thing E402 is about, and nothing here depends on import order.
"tests/*.py" = ["E402"]
# The gallery's helpers.py sets sys.path (to import the in-repo zombi2) and the matplotlib "Agg"
# backend before importing them — E402 is exactly the import-after-code rule those shims must break.
"gallery/*.py" = ["E402"]
