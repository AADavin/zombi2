site_name: ZOMBI2
site_description: Simulating the evolution of species trees, genomes, sequences and traits
site_url: https://aadavin.github.io/zombi2/docs/
repo_url: https://github.com/AADavin/zombi2
repo_name: AADavin/zombi2
docs_dir: docs
# Never publish LaTeX/BibTeX source (e.g. docs/references.bib) — MkDocs would
# otherwise copy them verbatim into the built site and serve them publicly.
exclude_docs: |
  *.tex
  *.bib
  # design/ holds SPEC.md — a repo reference (see CLAUDE.md),
  # not a published site page; keep it out of the build.
  design/

# The header title/logo links back to the main website (these docs are a /docs/ subsite).
extra:
  homepage: https://aadavin.github.io/zombi2/

theme:
  name: material
  # The same mark the main site uses (web/favicon.svg), symlinked into docs/img/ so there is one
  # file to change: the browser tab, the header logo and the main site all read it.
  favicon: img/favicon.svg
  logo: img/favicon.svg
  features:
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - search.suggest
    - toc.follow
  palette:
    # Light mode — the default, shown when the visitor's OS prefers light.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode — shown when the visitor's OS prefers dark; header toggle flips it.
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

# The chapter figures ARE wired in: `hooks/manual_figures.py` rewrites the book's
# `figures/<name>_print.png` to `../img/<name>.svg`, the tracked theme-aware source, and every one
# has a symlink under `docs/img/`. So the default (`warn`, which `--strict` makes fatal) is back:
# lowering it to `info` is what let four figures go missing from the site for weeks without the
# build saying a word. `tests/test_manual_code.py` checks the same thing from the other side.
validation:
  links:
    not_found: warn

# The chapters are written for pandoc, whose callouts are fenced divs (`::: note`). MkDocs has no
# such syntax and mkdocstrings claims every `::: identifier` line, so this rewrites the book's
# callouts to admonitions before they get that far. See the module docstring.
# Chapter figures name the book's print raster, which is a build artefact; this points them back at
# the authored SVG in docs/img/. See the module docstring.
hooks:
  - hooks/manual_callouts.py
  - hooks/manual_figures.py
  - hooks/manual_citations.py
  - hooks/manual_raw_latex.py

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: numpy
            show_root_heading: true
            show_source: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true
            filters: ["!^_"]
            # The two-column reference: each entry is stamped with what kind of thing it is
            # (mod / class / func / attr) beside its heading, and the same badge repeats in the
            # right-hand table of contents — so the contents column reads as an index of the
            # module's symbols rather than a list of bare names.
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            # A heading carries the short name; the full dotted path is on the module page's own
            # heading, so repeating it on every member would only make the contents column wrap.
            show_root_full_path: true
            show_object_full_path: false
            # Cross-references like [`SpeciesResult`][zombi2.species.SpeciesResult] (the overview
            # table) only resolve when the objects are registered as anchors.
            show_if_no_docstring: false

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - admonition
  # The chapters set their display formulas as TeX ($$…$$) so they typeset in both outputs — as
  # display math in the PDF, and here via MathJax (see javascripts/mathjax.js).
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true
  - tables
  - attr_list
  - md_in_html
  # Lets docs pages pull in manual/book chapters (single source of truth).
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

# The site IS the manual: every page under Guide and Reference is a snippet include of the
# corresponding file in manual/book/, so the book and the site cannot drift. The order below is
# the book's reading order. Adding a chapter means adding a stub page and a line here.
nav:
  - Home: index.md
  # Worked studies, straight after Home: what the tool is *for*, before what it does.
  - Examples:
      - Examples: examples/index.md
      - Can RED be trusted?: examples/red.md
      - Can BiSSE find the gene that drives speciation?: examples/bisse.md
      - What can gene order constrain?: examples/rearrangements.md
  - Guide:
      - Introduction: guide/introduction.md
      - Species trees: guide/species-trees.md
      - "Genomes I: gene families": guide/genomes.md
      - "Genomes II: ordered": guide/genomes-ordered.md
      - "Genomes III: nucleotide": guide/genomes-nucleotide.md
      - Sequences: guide/sequences.md
      - Traits: guide/traits.md
      - Conditioning: guide/conditioning.md
      - Joining: guide/joining.md
  - Rates in detail: rates.md
  - Output files: output-files.md
  - Tools:
      - Overview: tools.md
      - "format": tools/format.md
      - "tree": tools/tree.md
      - "treedist": tools/treedist.md
  # One page per level, so the reference reads the way the library is laid out and the left column
  # is an index of the packages. The overview page carries the entry-point table.
  - API reference:
      - Overview: api/index.md
      - zombi2.species: api/species.md
      - zombi2.genomes: api/genomes.md
      - zombi2.sequences: api/sequences.md
      - zombi2.traits: api/traits.md
      - zombi2.joint: api/joint.md
      - zombi2.params: api/rates.md
  - Performance: performance.md
  - Reproducibility: reproducibility.md
  - Coming from ZOMBI v1: from-zombi1.md
  - FAQ: faq.md
